name: Build credential retrieval

on:
  push:
    paths:
      - credential-retrieval/**
      - Makefile
      - .github/workflows/credential-build.yml
  pull_request:
    paths:
      - credential-retrieval/**
      - Makefile
      - .github/workflows/credential-build.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: credential-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install signing tool
        run: brew install ldid
      - name: Build device bundle
        run: make credential-bundle
      - name: Verify device bundle
        run: |
          for file in credential.ios driver.ios trigger.ios static-key-table.bin core4-word-table.bin; do
            test -s "credential-retrieval/build/bundle/$file"
          done
      - name: Upload device bundle
        uses: actions/upload-artifact@v7
        with:
          name: credential-bundle-ios-arm64
          path: credential-retrieval/build/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Update rolling release
    needs: build
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download device bundle
        uses: actions/download-artifact@v8
        with:
          name: credential-bundle-ios-arm64
          path: build
      - name: Create release ZIP
        working-directory: build
        run: zip -r ../credential-bundle-ios-arm64.zip .
      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag_exists=$(gh api "repos/$GH_REPO/git/matching-refs/tags/latest" \
            --jq 'any(.[]; .ref == "refs/tags/latest")')
          if [ "$tag_exists" = true ]; then
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/latest" \
              -f sha="$GITHUB_SHA" -F force=true
          else
            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f ref=refs/tags/latest -f sha="$GITHUB_SHA"
          fi

          printf 'Credential retrieval build from commit `%s`.\n\nBuild: %s/%s/actions/runs/%s\n' \
            "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > release-notes.md

          if gh release view latest > /dev/null 2>&1; then
            gh release upload latest credential-bundle-ios-arm64.zip --clobber
            gh release edit latest --title "Latest rolling release" \
              --notes-file release-notes.md --latest --prerelease=false
          else
            gh release create latest credential-bundle-ios-arm64.zip \
              --verify-tag --title "Latest rolling release" \
              --notes-file release-notes.md --latest
          fi
